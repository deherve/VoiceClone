<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceClone</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#ffb03b"/><g fill="#1a1300"><rect x="5" y="11" width="2.6" height="6" rx="1.3"/><rect x="9.4" y="7" width="2.6" height="14" rx="1.3"/><rect x="13.8" y="4.5" width="2.6" height="19" rx="1.3"/><rect x="18.2" y="8" width="2.6" height="12" rx="1.3"/><rect x="22.6" y="11.5" width="2" height="5" rx="1"/></g></svg>
      <h1>VoiceClone</h1>
    </div>
    <nav data-i18n-attr="aria-label:nav.pages">
      <button type="button" id="nav-studio" aria-pressed="true" data-i18n="nav.studio"></button>
      <button type="button" id="nav-settings" aria-pressed="false" data-i18n="nav.settings"></button>
    </nav>
    <span class="grow"></span>
    <button type="button" id="upd-badge" class="chip badge" hidden></button>
    <span id="mcp" class="chip" role="status"><span class="dot" aria-hidden="true"></span><span id="mcp-text"></span></span>
  </header>

  <section id="settings" aria-labelledby="h-language" hidden>
    <div id="settings-tabs" class="tabs" role="tablist" data-i18n-attr="aria-label:tab.aria"></div>
    <div class="panels">
    <div class="tabpanel" id="tab-interface" role="tabpanel" aria-labelledby="tab-btn-interface" hidden>
    <h2 id="h-language" data-i18n="set.language"></h2>
    <p class="hint" id="language-hint" data-i18n="set.language_hint"></p>
    <div id="languages" class="themes" role="radiogroup" aria-labelledby="language-hint"></div>

    <h2 id="h-theme" data-i18n="set.appearance"></h2>
    <p id="themes-hint" class="hint" data-i18n="set.appearance_hint"></p>
    <div id="themes" class="themes" role="radiogroup" aria-labelledby="themes-hint"></div>
    </div>
    <div class="tabpanel" id="tab-voices" role="tabpanel" aria-labelledby="tab-btn-voices" hidden>
    <h2 id="h-vx" data-i18n="vx.title"></h2>
    <p class="hint" data-i18n="vx.hint"></p>
    <p id="vx-dir" class="hint"></p>
    <ul id="vx-list" class="list"></ul>
    <div class="row">
      <button type="button" id="vx-export-all" data-i18n="vx.export_all"></button>
      <button type="button" id="vx-import" data-i18n="vx.import"></button>
      <button type="button" id="vx-open" data-i18n="vx.open"></button>
    </div>
    <p id="vx-status" class="status" role="status"></p>
    </div>
    <div class="tabpanel" id="tab-text" role="tabpanel" aria-labelledby="tab-btn-text" hidden>
    <h2 id="h-pron" data-i18n="pr.title"></h2>
    <p class="hint" data-i18n="pr.hint"></p>
    <label class="inline"><input type="checkbox" id="pr-numbers"><span data-i18n="pr.numbers"></span></label>
    <ul id="pr-list" class="list"></ul>
    <div class="row">
      <button type="button" id="pr-add" data-i18n="pr.add"></button>
      <button type="button" id="pr-save" class="primary" data-i18n="pr.save"></button>
    </div>
    <p id="pr-status" class="status" role="status"></p>
    </div>
    <div class="tabpanel" id="tab-connect" role="tabpanel" aria-labelledby="tab-btn-connect" hidden>
    <h2 id="h-connect" data-i18n="conn.title"></h2>
    <p class="hint" data-i18n="conn.hint"></p>
    <p id="conn-warn" class="hint warn" hidden data-i18n="conn.no_server"></p>
    <div id="conn-blocks" class="codeblocks"></div>
    <p id="conn-status" class="status" role="status"></p>
    </div>
    <div class="tabpanel" id="tab-audios" role="tabpanel" aria-labelledby="tab-btn-audios" hidden>
    <h2 id="h-audios" data-i18n="aud.title"></h2>
    <p class="hint" data-i18n="aud.hint"></p>
    <p id="aud-path" class="hint"></p>
    <button type="button" id="aud-open" data-i18n="aud.open"></button>
    </div>
    <div class="tabpanel" id="tab-models" role="tabpanel" aria-labelledby="tab-btn-models" hidden>
    <h2 id="h-settings" data-i18n="models.title"></h2>
    <p class="hint" id="models-hint"></p>
    <ul id="model-list" class="list"></ul>
    <p id="models-status" class="status" role="status"></p>

    <h2 id="h-transcribe" data-i18n="tr.title"></h2>
    <p class="hint" data-i18n="tr.hint"></p>
    <p id="tr-state" class="hint"></p>
    <div class="row">
      <button type="button" id="tr-install" class="primary" data-i18n="tr.install"></button>
      <button type="button" id="tr-cancel" hidden data-i18n="tr.cancel"></button>
      <button type="button" id="tr-remove" hidden data-i18n="common.delete"></button>
    </div>
    <progress id="tr-bar" max="100" value="0" hidden></progress>
    <p id="tr-status" class="status" role="status"></p>

    <h2 id="h-writer" data-i18n="wr.set_title"></h2>
    <p class="hint" data-i18n="wr.set_hint"></p>
    <p id="wr-state" class="hint"></p>
    <div class="row">
      <button type="button" id="wr-install" class="primary" data-i18n="wr.install"></button>
      <button type="button" id="wr-cancel" hidden data-i18n="tr.cancel"></button>
      <button type="button" id="wr-remove" hidden data-i18n="common.delete"></button>
    </div>
    <progress id="wr-bar" max="100" value="0" hidden></progress>
    <p id="wr-status" class="status" role="status"></p>

    <h2 id="h-components" data-i18n="comp.title"></h2>
    <p class="hint" data-i18n="comp.hint"></p>
    <ul id="comp-list" class="list"></ul>
    <p id="comp-status" class="status" role="status"></p>
    </div>
    <div class="tabpanel" id="tab-gpu" role="tabpanel" aria-labelledby="tab-btn-gpu" hidden>
    <h2 id="h-gpu" data-i18n="gpu.title"></h2>
    <p id="gpu-summary" class="hint"></p>
    <label for="gpu-device" data-i18n="gpu.device"></label>
    <select id="gpu-device"></select>
    <p id="gpu-best-note" class="hint" hidden></p>
    <p id="gpu-nvidia" class="hint warn" hidden data-i18n="gpu.nvidia"></p>
    <p id="gpu-note" class="hint warn"></p>
    <details id="gpu-advanced">
      <summary data-i18n="gpu.advanced"></summary>
      <p class="hint" data-i18n="gpu.advanced_hint"></p>
      <label for="gpu-fa" data-i18n="gpu.fa"></label>
      <select id="gpu-fa"></select>
      <label for="gpu-clamp" data-i18n="gpu.clamp"></label>
      <select id="gpu-clamp"></select>
    </details>
    <p id="gpu-status" class="status" role="status"></p>

    <h2 data-i18n="mem.title"></h2>
    <p class="hint" id="memory-state"></p>
    <div class="row">
      <button type="button" id="unload" data-i18n="mem.unload"></button>
      <button type="button" id="open-models" data-i18n="mem.open"></button>
    </div>
    <p class="hint" id="models-dir"></p>
    </div>
    <div class="tabpanel" id="tab-updates" role="tabpanel" aria-labelledby="tab-btn-updates" hidden>
    <h2 id="h-updates" data-i18n="upd.title"></h2>
    <p id="upd-version" class="hint"></p>
    <div class="row">
      <button type="button" id="upd-check" data-i18n="upd.check"></button>
      <label class="inline"><input type="checkbox" id="upd-auto"><span data-i18n="upd.auto"></span></label>
    </div>
    <p id="upd-status" class="status" role="status"></p>
    <div id="upd-card" class="card" hidden>
      <strong id="upd-new"></strong>
      <p id="upd-size" class="hint"></p>
      <h3 data-i18n="upd.notes"></h3>
      <p id="upd-notes" class="notes"></p>
      <div class="row">
        <button type="button" id="upd-install" class="primary" data-i18n="upd.install"></button>
        <button type="button" id="upd-open" data-i18n="upd.open"></button>
      </div>
      <progress id="upd-progress" max="100" value="0" hidden></progress>
      <p id="upd-noauto" class="hint warn" hidden data-i18n="upd.noauto"></p>
      <p class="hint" data-i18n="upd.how"></p>
    </div>
    </div>
    </div>
  </section>

  <dialog id="writer" aria-labelledby="w-title">
    <form method="dialog">
      <h2 id="w-title" data-i18n="wr.title"></h2>
      <div id="w-missing" hidden>
        <p id="w-missing-text" class="hint"></p>
        <div class="row">
          <button type="button" id="w-install" class="primary" data-i18n="wr.install"></button>
        </div>
        <progress id="w-bar" max="100" value="0" hidden></progress>
      </div>
      <div id="w-main">
        <label for="w-prompt" data-i18n="wr.prompt"></label>
        <textarea id="w-prompt" rows="3" maxlength="1500" data-i18n-attr="placeholder:wr.placeholder"></textarea>
        <div class="w-grid">
          <div><label for="w-mode" data-i18n="wr.mode"></label><select id="w-mode"></select></div>
          <div><label for="w-lang" data-i18n="wr.lang"></label><select id="w-lang"></select></div>
          <div><label for="w-tone" data-i18n="wr.tone"></label><select id="w-tone"></select></div>
          <div><label for="w-minutes" data-i18n="wr.duration"></label><input type="number" id="w-minutes" min="0.5" max="120" step="0.5" value="1"></div>
        </div>
        <p id="w-estimate" class="hint"></p>
        <fieldset id="w-voices"><legend data-i18n="wr.voices"></legend><div id="w-voice-list"></div></fieldset>
        <label for="w-result" data-i18n="wr.result"></label>
        <textarea id="w-result" rows="8"></textarea>
      </div>
      <p id="w-status" class="status" role="status"></p>
      <div class="row end">
        <button type="button" id="w-generate" class="primary" data-i18n="wr.generate"></button>
        <button type="button" id="w-stop" hidden data-i18n="wr.stop"></button>
        <button type="button" id="w-insert" disabled data-i18n="wr.insert"></button>
        <button type="button" id="w-replace" disabled data-i18n="wr.replace"></button>
        <button type="submit" value="cancel" data-i18n="wr.close"></button>
      </div>
    </form>
  </dialog>

  <dialog id="ask" aria-labelledby="ask-title">
    <form method="dialog">
      <h2 id="ask-title" data-i18n="ask.title"></h2>
      <p id="ask-msg"></p>
      <div class="row end">
        <button type="submit" value="cancel" data-i18n="ask.cancel"></button>
        <button type="submit" value="ok" id="ask-ok" class="primary" data-i18n="ask.ok"></button>
      </div>
    </form>
  </dialog>

  <main id="studio">
    <section id="voices" aria-labelledby="h-voices">
      <h2 id="h-voices" data-i18n="voices.title"></h2>
      <ul id="profile-list" class="list"></ul>

      <details id="new-profile-box">
        <summary data-i18n="voices.new"></summary>
        <form id="new-profile">
          <label for="np-name" data-i18n="voices.name"></label>
          <input id="np-name" required maxlength="60" autocomplete="off">
          <label for="np-lang" data-i18n="voices.language"></label>
          <select id="np-lang"></select>
          <button type="submit" data-i18n="voices.add"></button>
        </form>
      </details>

      <div id="samples-panel" hidden>
        <h2 id="samples-title"></h2>
        <p class="hint" data-i18n="samples.hint"></p>
        <div class="row split">
          <button type="button" id="rec"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="rec-label" data-i18n="samples.rec"></span></button>
          <button type="button" id="import"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><span data-i18n="samples.import"></span></button>
          <input type="file" id="file" accept="audio/*,video/*" hidden>
        </div>
        <blockquote id="read-me" hidden></blockquote>
        <p id="sample-status" class="status" role="status"></p>
        <ul id="sample-list" class="list"></ul>
        <p id="sample-notes" class="hint warn"></p>
      </div>
    </section>

    <section id="compose" aria-labelledby="h-compose">
      <div class="row head">
        <h2 id="h-compose"><label for="text" data-i18n="compose.title"></label></h2>
        <div class="head-right">
          <button type="button" id="clear" class="ghost" disabled data-i18n="compose.clear"></button>
          <div class="seg" id="text-version" role="group" data-i18n-attr="aria-label:pv.aria">
            <button type="button" id="tv-original" aria-pressed="true" data-i18n="pv.original"></button>
            <button type="button" id="tv-phonetic" aria-pressed="false" data-i18n="pv.phonetic" data-i18n-attr="title:pv.tip"></button>
          </div>
        </div>
      </div>
      <div id="tags" class="tags" role="toolbar" data-i18n-attr="aria-label:tags.aria"></div>
      <div class="editor"><textarea id="text" data-i18n-attr="placeholder:compose.placeholder" spellcheck="false"></textarea><div id="hl" class="hl" aria-hidden="true"><div id="hl-in"></div></div></div>
      <div class="row foot">
        <span id="count" class="voice-line"></span>
        <span class="grow hint right" data-i18n="compose.hint"></span>
        <button type="button" id="go" class="primary" disabled data-i18n="compose.go"></button>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>

    <section id="history" aria-labelledby="h-history">
      <div class="row head">
        <h2 id="h-history" data-i18n="gen.title"></h2>
        <span id="gen-count" class="hint"></span>
        <button type="button" id="gen-clear" class="ghost danger icon" disabled data-i18n-attr="title:gen.clear_all;aria-label:gen.clear_all"></button>
      </div>
      <ul id="gen-list" class="list"></ul>
    </section>
  </main>

  <audio id="player"></audio>
  <script src="main.js"></script>
</body>
</html>
