[package]
name = "voiceclone"
version = "0.1.0"
edition = "2021"

# Nom distinct de l'application (VoiceClone.exe) : Windows ne distingue pas les majuscules, les deux se ecraseraient.
[[bin]]
name = "voiceclone-server"
path = "src/main.rs"

[dependencies]
qwen-sys = { path = "../qwen-sys" }
hound = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tiny_http = "0.12"
ureq = "2"
mp3lame-encoder = "0.2"
